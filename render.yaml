services:
  - type: web
    name: langbuddy
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: SF_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DOMESTIC_API_KEY
        sync: false
      - key: ZPAY_PID
        sync: false
      - key: ZPAY_KEY
        sync: false
      - key: SITE_URL
        value: https://langbuddy.org
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
